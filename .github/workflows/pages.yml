name: Publicar app no GitHub Pages

on:
  push:
    branches: [main]
    paths: ["pwa/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

# Dois jobs: o deploy roda depois que o artefato do build já está registrado.
# No mesmo job, o deploy às vezes não achava o artefato ("Found 0 artifact(s)").
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Conferir que não há chave secreta no site
        run: |
          if grep -rEn "sb_secret_[A-Za-z0-9_-]{8,}|\"role\" *: *\"service_role\"|c2VydmljZV9yb2xl" pwa/; then
            echo "Chave secreta encontrada em pwa/. Remova antes de publicar."; exit 1
          fi
      - run: touch pwa/.nojekyll
      - uses: actions/upload-pages-artifact@v5
        with:
          path: pwa
          include-hidden-files: true

  publicar:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
